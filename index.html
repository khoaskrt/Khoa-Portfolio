    <style>
      /* Styles for Preloader */
      body.loading {
        overflow: hidden !important;
      }
      
      .loader-wrapper {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: #000000;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 99999;
        transition: transform 0.8s cubic-bezier(0.76, 0, 0.24, 1);
      }
      
      .loader-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 24px;
      }
      
      .logo-container {
        position: relative;
        width: 120px;
        height: 120px;
      }
      
      .logo-base {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        fill: #333333;
      }
      
      .logo-fill {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        fill: #ffffff;
        clip-path: polygon(0% 100%, 100% 100%, 100% 100%, 0% 100%);
      }
      
      .loader-percentage {
        color: #ffffff;
        font-family: 'General Sans', sans-serif;
        font-size: 1.5rem;
        font-weight: 500;
        letter-spacing: 0.05em;
        font-variant-numeric: tabular-nums;
      }
      
      .loader-wrapper.slide-up {
        transform: translateY(-100%);
      }
    </style>
  </head>

    <!-- Script for Preloader -->
    <script>
      (function() {
        const percentageElement = document.getElementById("loaderPercentage");
        const logoFillElement = document.querySelector(".logo-fill");
        const loaderWrapper = document.getElementById("loaderWrapper");

        const DURATION = 2500;
        const START_VAL = 0;
        const END_VAL = 100;
        let startTime = null;

        function easeInOutCubic(t) {
          return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        }

        function animateLoader(timestamp) {
          if (!startTime) startTime = timestamp;
          const progressTime = timestamp - startTime;
          
          let timeFraction = progressTime / DURATION;
          if (timeFraction > 1) timeFraction = 1;
          
          const progress = easeInOutCubic(timeFraction);
          const currentPercent = Math.floor(START_VAL + (END_VAL - START_VAL) * progress);
          
          if(percentageElement) {
            percentageElement.textContent = `${currentPercent}%`;
          }
          
          if(logoFillElement) {
            const clipY = 100 - (progress * 100);
            logoFillElement.style.clipPath = `polygon(0% ${clipY}%, 100% ${clipY}%, 100% 100%, 0% 100%)`;
          }

          if (progressTime < DURATION) {
            requestAnimationFrame(animateLoader);
          } else {
            setTimeout(() => {
              if(loaderWrapper) {
                loaderWrapper.classList.add("slide-up");
              }
              document.body.classList.remove("loading");
              
              // Remove loader from DOM after transition completes to not block clicks
              setTimeout(() => {
                if(loaderWrapper) loaderWrapper.remove();
              }, 800);
            }, 400);
          }
        }

        requestAnimationFrame(animateLoader);
      })();
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
